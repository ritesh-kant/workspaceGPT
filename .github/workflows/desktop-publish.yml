name: Publish Desktop App

# Builds and publishes the WorkspaceGPT desktop app (apps/desktop, Tauri) for
# macOS arm64 and x64 and Windows x64 (docs/design/desktop.md Phase 3). Linux
# is not built yet.
#
#   - Push a tag desktop-vX.Y.Z: build every target, create release
#     desktop-vX.Y.Z (DMGs, the Windows installer, updater bundles + .sig,
#     SHA256SUMS.txt), then point the rolling `desktop-latest` release's
#     latest.json, install.sh and install.ps1 at it.
#     Installed apps poll that latest.json (src-tauri/tauri.conf.json).
#   - Manual run: build only, artifacts attached to the run, nothing released.
#
# The tag's X.Y.Z must equal apps/desktop/package.json and tauri.conf.json
# `version` (the updater compares the latter).
# Requires the TAURI_SIGNING_PRIVATE_KEY repo secret: the minisign key whose
# public half is plugins.updater.pubkey in tauri.conf.json. Without the same
# key, installed apps reject every update.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both Macs on Apple Silicon: the x64 build cross-compiles (rustup
          # target), stages the x64 Node + native packages (pnpm
          # supportedArchitectures installs them all), and codesign doesn't
          # care which CPU it signs for.
          - { target: darwin-arm64, os: macos-14, rust: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { target: darwin-x64, os: macos-14, rust: "aarch64-apple-darwin,x86_64-apple-darwin" }
          # Windows builds natively. No code-signing certificate: install.ps1
          # downloads without the internet mark, so SmartScreen doesn't stop it.
          - { target: win32-x64, os: windows-latest, rust: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check version
        id: version
        shell: bash
        run: |
          app=$(node -p "require('./apps/desktop/package.json').version")
          tauri=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "$app" = "$tauri" ] || { echo "package.json $app ≠ tauri.conf.json $tauri"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "desktop-v$app" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $app"; exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

      # macOS /bin/sh (bash 3.2) in a UTF-8 locale reads a multibyte character
      # after $VAR as part of the name ("PLATFORM…: unbound variable"), and
      # Windows PowerShell 5.1 decodes an undeclared download as Latin-1.
      - name: Check installers are ASCII
        shell: bash
        run: |
          if LC_ALL=C grep -n '[^ -~	]' apps/desktop/install.sh apps/desktop/install.ps1; then
            echo "install.sh / install.ps1 must be ASCII (lines above)"; exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: node apps/desktop/scripts/build-release.mjs --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Name artifacts by version and target
        shell: bash
        run: |
          v=${{ steps.version.outputs.version }}; t=${{ matrix.target }}
          mkdir -p out
          case "$t" in
            win32-x64)
              b=apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle
              cp "$b"/nsis/*-setup.exe "out/WorkspaceGPT_${v}_${t}-setup.exe"
              cp "$b"/nsis/*-setup.exe.sig "out/WorkspaceGPT_${v}_${t}-setup.exe.sig" ;;
            *)
              triple=$([ "$t" = darwin-arm64 ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin)
              b=apps/desktop/src-tauri/target/$triple/release/bundle
              cp "$b"/dmg/*.dmg "out/WorkspaceGPT_${v}_${t}.dmg"
              cp "$b/macos/WorkspaceGPT.app.tar.gz" "out/WorkspaceGPT_${v}_${t}.app.tar.gz"
              cp "$b/macos/WorkspaceGPT.app.tar.gz.sig" "out/WorkspaceGPT_${v}_${t}.app.tar.gz.sig" ;;
          esac
          ls -la out

      # Windows: install the way users will (install.ps1, against this build
      # served locally), then smoke-test the installed app and the real
      # Credential Manager.
      - name: Install with install.ps1 and smoke-test (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $setup = "WorkspaceGPT_${v}_win32-x64-setup.exe"
          Push-Location out
          (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower() + "  $setup" | Out-File -Encoding ascii SHA256SUMS.txt
          node ../apps/desktop/scripts/updater-manifest.mjs --version $v --base-url http://127.0.0.1:8799 --out latest.json "windows-x86_64=$setup"
          $server = Start-Process -PassThru -WindowStyle Hidden python -ArgumentList '-m','http.server','8799','--bind','127.0.0.1'
          Pop-Location
          Start-Sleep 3
          try {
            $env:WGPT_MANIFEST_URL = 'http://127.0.0.1:8799/latest.json'
            ./apps/desktop/install.ps1
            node apps/desktop/scripts/smoke-installed.mjs --exe "$env:LOCALAPPDATA\WorkspaceGPT\WorkspaceGPT.exe"
            if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
            node apps/desktop/scripts/secrets-chunk-test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'secrets test failed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            Remove-Item out/SHA256SUMS.txt, out/latest.json -ErrorAction SilentlyContinue
          }

      - name: Smoke-test the app (macOS arm64)
        if: matrix.target == 'darwin-arm64'
        run: node apps/desktop/scripts/smoke-installed.mjs --exe apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/WorkspaceGPT.app/Contents/MacOS/WorkspaceGPT

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true

      - name: Release desktop-vX.Y.Z
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}; v=${tag#desktop-v}
          cd out
          sha256sum WorkspaceGPT_${v}_*.dmg WorkspaceGPT_${v}_*.app.tar.gz WorkspaceGPT_${v}_*-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # --latest=false: the repo's "Latest release" stays the extension's
          # (installed apps and install.sh use the rolling desktop-latest release instead).
          gh release create "$tag" --title "WorkspaceGPT Desktop $v" --latest=false \
            --notes "WorkspaceGPT Desktop $v for macOS (Apple Silicon and Intel) and Windows (x64). macOS: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest/install.sh | sh\`. The DMG is not notarized: after dragging the app to Applications, open it once via System Settings → Privacy & Security → Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/WorkspaceGPT.app\`. Windows, in PowerShell: \`irm https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest/install.ps1 | iex\`. The Windows installer is not code-signed: if you download the -setup.exe in a browser, SmartScreen says 'Windows protected your PC'; choose More info → Run anyway." \
            WorkspaceGPT_${v}_*.dmg WorkspaceGPT_${v}_*.app.tar.gz WorkspaceGPT_${v}_*.app.tar.gz.sig WorkspaceGPT_${v}_*-setup.exe WorkspaceGPT_${v}_*-setup.exe.sig SHA256SUMS.txt

      - name: Point desktop-latest at it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}; v=${tag#desktop-v}
          node apps/desktop/scripts/updater-manifest.mjs --version "$v" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag" \
            --out out/latest.json \
            darwin-aarch64=out/WorkspaceGPT_${v}_darwin-arm64.app.tar.gz \
            darwin-x86_64=out/WorkspaceGPT_${v}_darwin-x64.app.tar.gz \
            windows-x86_64=out/WorkspaceGPT_${v}_win32-x64-setup.exe
          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest --title "WorkspaceGPT Desktop (latest)" --latest=false --prerelease \
              --notes "Rolling pointer to the newest desktop release: latest.json (read by installed apps), install.sh (macOS) and install.ps1 (Windows). Download builds from the versioned desktop-v* releases."
          gh release upload desktop-latest out/latest.json apps/desktop/install.sh apps/desktop/install.ps1 --clobber

  # Install from the published desktop-latest URLs exactly as the README says,
  # in the shells users have: GitHub serves these assets as
  # application/octet-stream, which the local-server install above never sees.
  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: curl install.sh | sh (macOS, UTF-8 locale like Terminal)
        if: runner.os == 'macOS'
        shell: bash
        env:
          LC_ALL: en_US.UTF-8
          WGPT_INSTALL_DIR: ${{ runner.temp }}/apps
        run: |
          v=${GITHUB_REF_NAME#desktop-v}
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest/install.sh" | /bin/sh
          got=$(plutil -extract CFBundleShortVersionString raw -o - "$WGPT_INSTALL_DIR/WorkspaceGPT.app/Contents/Info.plist")
          [ "$got" = "$v" ] || { echo "installed $got, expected $v"; exit 1; }

      - name: irm install.ps1 | iex (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/desktop-latest/install.ps1" | iex
          if (-not (Test-Path "$env:LOCALAPPDATA\WorkspaceGPT\WorkspaceGPT.exe")) { throw 'WorkspaceGPT.exe was not installed' }
