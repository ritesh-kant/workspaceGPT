[package]
name = "wgpt-calls"
version = "0.1.0"
edition = "2021"
description = "Windows call detection and on-device call transcription"

[workspace]

[features]
default = ["transcription"]
transcription = ["dep:whisper-rs"]

[dependencies]
serde_json = "1"
whisper-rs = { version = "=0.16.0", optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
windows = { version = "0.62.2", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
strip = true
